name: Basic React CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20" # Changed from 22 to 20 for compatibility
          cache: "npm"

      # Clean install
      - run: npm ci

      # Build your React app
      - run: npm run build

      # Deploy to Cloudflare Workers
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        env:
          # Temporary fix: Allow Node 20 usage until action supports Node 22/24
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --env production # Added deployment command
